name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: SublimeText/UnitTesting/actions/setup@v1
        with:
          sublime-text-version: 4
          install-package-control: true
      - name: Pre-start Sublime Text
        if: runner.os == 'macOS'
        run: .github/scripts/prestart_sublime_text.sh
      - uses: SublimeText/UnitTesting/actions/run-tests@v1
